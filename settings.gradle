pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.arcseekers.com/releases' }
        maven { url = 'https://maven.cleanroommc.com' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.wagyourtail.xyz/releases' }
        maven { url = 'https://maven.wagyourtail.xyz/snapshots' }
        // 国内镜像
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
    }
}

// No toolchain auto-provisioning plugin: JDK 25 must already be installed and is
// discovered through org.gradle.java.installations.paths in gradle.properties.
// This keeps builds offline-capable and avoids resolving plugins at configuration time.

rootProject.name = 'CeleritasCTM'
