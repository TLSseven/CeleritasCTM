mod_id = celeritasctm
mod_name = CeleritasCTM
mod_version = 1.0.0
mod_description = Connected Textures and natural textures for Actinium/Celeritas on Cleanroom 1.12.2
mod_authors = TLSseven
mod_credits = Based on CTM by Chisel Team and Continuity by PepperBell
mod_url = 
mod_update_json = 
mod_logo_path = 

root_package = team.celeritasctm

# Cleanroom loader (target baseline: 0.6.13-alpha)
cleanroom_loader_version = 0.6.13-alpha

# Mixin
mixin_configs = mixins.celeritasctm.json

# Use access transformer
use_access_transformer = false
access_transformer_locations = 

# Not a coremod - uses Mixin instead
is_coremod = false
coremod_plugin_class_name = 
coremod_includes_mod = false

# Build
generate_sources_jar = true
generate_javadocs_jar = false
minecraft_username = Developer
extra_jvm_args = 

# Source compatibility
java_version = 8
org.gradle.jvmargs=-Xmx4G

# Actinium compile dependency (Sodium/Celeritas rendering pipeline, target alpha-0.0.13).
# Not set here: this file is committed, so no machine-specific path may live in it.
# Provide it per machine, e.g. `-Pactinium_jar=<path>` or in ~/.gradle/gradle.properties:
#   actinium_jar=<path to Actinium-alpha-0.0.13.jar>

# JDK discovery for the Java 25 toolchain.
# No machine-specific install path is committed. The toolchain resolves JDK 25 from
# JAVA_HOME / PATH / the running Gradle JVM. If JDK 25 is installed elsewhere, either
# run Gradle with JAVA_HOME pointing at it, or set the following in
# ~/.gradle/gradle.properties (per machine, not in this repository):
#   org.gradle.java.installations.paths=<path to JDK 25>,<path to any other JDK>
