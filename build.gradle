buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.cleanroommc.com' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
    }
}

plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'xyz.wagyourtail.unimined' version '1.4.26-kappa'
}

apply from: 'gradle/scripts/helpers.gradle'

// ========== Properties Helpers ==========

String propertyString(String key) {
    return project.findProperty(key)?.toString() ?: ''
}

Boolean propertyBool(String key) {
    return propertyString(key).toBoolean()
}

void assertProperty(String key) {
    if (propertyString(key).isEmpty()) {
        throw new GradleException("Property ${key} is required but not set")
    }
}

// ========== Project Configuration ==========

version = propertyString('mod_version')
group = propertyString('root_package')

base {
    archivesName = propertyString('mod_name')
}

// Compilation runs on a JDK 25 toolchain because the Cleanroom loader jars are
// compiled for Java 25 (class file major 69) and cannot be read by older
// compilers. The produced bytecode stays Java 8 via `options.release = 8`.
// The concrete JDK location is resolved by the toolchain, never hardcoded.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// ========== Repositories ==========

repositories {
    mavenCentral()
    maven { url = 'https://maven.cleanroommc.com' }
    maven { url = 'https://cursemaven.com' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.aliyun.com/repository/central' }
}

// ========== Dependencies ==========

// Actinium is consumed as a local artifact so the compile classpath always
// matches the runtime jar. Pass it explicitly:
//   gradle build -Pactinium_jar="<path to Actinium-alpha-0.0.13.jar>"
// or set `actinium_jar` in ~/.gradle/gradle.properties (per machine).
// The expected API level is Actinium alpha-0.0.13.
//
// Resolution is lazy so unrelated tasks (e.g. `gradle tasks`) still configure
// offline; the missing property only fails when something actually needs the
// artifact, and then with an actionable message.
def actiniumJarPath = propertyString('actinium_jar')
def actiniumJarProvider = providers.provider {
    if (actiniumJarPath.isEmpty()) {
        throw new GradleException(
            'Property actinium_jar is required: pass -Pactinium_jar=<path to Actinium-alpha-0.0.13.jar>')
    }
    def candidate = file(actiniumJarPath)
    if (!candidate.isFile()) {
        throw new GradleException("actinium_jar does not point to a readable jar: ${candidate}")
    }
    candidate
}

def targetActiniumJar = files(actiniumJarProvider)

configurations {
    embed
    implementation.extendsFrom(embed)
    modCompileOnly
    compileOnly.extendsFrom(modCompileOnly)
    modRuntimeOnly
    runtimeOnly.extendsFrom(modRuntimeOnly)
}

dependencies {
    // Mixin - provided by Cleanroom loader at runtime
    compileOnly 'org.spongepowered:mixin:0.8.5'

    // Actinium (Sodium/Celeritas rendering pipeline) - property-injected jar
    compileOnly targetActiniumJar

    // GTNHLib (optional - for advanced features)
    // modCompileOnly 'com.github.GTNewHorizons:GTNHLib:2.1.17:dev'
}

// Checks the target Actinium artifact and compiled mixin/config contracts.

def classPool = { byte[] bytes ->
    def input = new DataInputStream(new ByteArrayInputStream(bytes))
    if (input.readInt() != -889275714) {
        throw new GradleException('Invalid Java class file')
    }
    input.skipBytes(4)
    int count = input.readUnsignedShort()
    def utf8 = new String[count]
    def classNames = new int[count]
    for (int i = 1; i < count; i++) {
        int tag = input.readUnsignedByte()
        switch (tag) {
            case 1: utf8[i] = input.readUTF(); break
            case 3: case 4: input.skipBytes(4); break
            case 5: case 6: input.skipBytes(8); i++; break
            case 7: classNames[i] = input.readUnsignedShort(); break
            case 8: case 16: case 19: case 20: input.skipBytes(2); break
            case 9: case 10: case 11: case 12: case 17: case 18: input.skipBytes(4); break
            case 15: input.skipBytes(3); break
            default: throw new GradleException("Unknown class-file constant-pool tag ${tag}")
        }
    }
    [utf8: utf8, classes: classNames.findAll { it != 0 }.collect { utf8[it] } as Set]
}

tasks.register('verifyContracts') {
    group = 'verification'
    description = 'Verifies the compile-time contracts against the injected Actinium jar.'

    def mixinConfig = layout.projectDirectory.file('src/main/resources/mixins.celeritasctm.json')
    def actiniumFile = targetActiniumJar.singleFile

    dependsOn tasks.named('compileJava')
    inputs.files(sourceSets.main.output.classesDirs)
    inputs.files(targetActiniumJar)
    inputs.file(mixinConfig)
    outputs.upToDateWhen { false }

    doLast {
        // 1. Namespace contract: the target Actinium artifact must expose the
        //    embeddium types we compile against, under the `dhj/` namespace.
        def requiredEntries = [
            'com/dhj/actinium/render/terrain/compile/task/ChunkBuilderMeshingTask.class',
            'dhj/embeddedt/embeddium/impl/render/chunk/compile/ChunkBuildContext.class',
            'dhj/embeddedt/embeddium/impl/render/chunk/compile/ChunkBuildOutput.class',
            'dhj/embeddedt/embeddium/impl/util/task/CancellationToken.class',
            'dhj/embeddedt/embeddium/api/OptionGUIConstructionEvent.class',
            'dhj/embeddedt/embeddium/api/options/structure/OptionPage.class',
            'dhj/embeddedt/embeddium/api/options/structure/OptionStorage.class',
            'dhj/embeddedt/embeddium/api/options/structure/OptionImpl.class',
            'dhj/embeddedt/embeddium/api/options/control/TickBoxControl.class',
        ]
        new java.util.zip.ZipFile(actiniumFile).withCloseable { zip ->
            def names = java.util.Collections.list(zip.entries()).collect { it.name } as Set
            requiredEntries.each { entry ->
                if (!names.contains(entry)) {
                    throw new GradleException("Actinium contract: ${entry} missing from ${actiniumFile}")
                }
            }
            // 2. Descriptor contract: execute() must reference the dhj/ types and
            //    no longer the legacy org/embeddedt namespace.
            def taskEntry = zip.getEntry(
                'com/dhj/actinium/render/terrain/compile/task/ChunkBuilderMeshingTask.class')
            def bytes = zip.getInputStream(taskEntry).bytes
            def text = new String(bytes, 'ISO-8859-1')
            def expected = 'dhj/embeddedt/embeddium/impl/render/chunk/compile/ChunkBuildContext'
            if (!text.contains(expected)) {
                throw new GradleException(
                    "Actinium contract: ChunkBuilderMeshingTask.execute does not reference ${expected}")
            }
            if (text.contains('org/embeddedt/embeddium')) {
                throw new GradleException(
                    'Actinium contract: legacy org/embeddedt namespace still present in ChunkBuilderMeshingTask')
            }
        }

        // 3. Compiled source contract: javac resolves these API types against the
        //    injected artifact; inspect class constants for accidental old symbols.
        def legacySymbols = [
            'org/embeddedt/embeddium',
            'net/caffeinemc/mods/sodium/api',
            'ActiniumConfigBootstrap'
        ]
        sourceSets.main.output.classesDirs.files.each { File classesDir ->
            if (!classesDir.isDirectory()) return
            fileTree(classesDir).matching { include '**/*.class' }.each { File classFile ->
                def pool = classPool(classFile.bytes)
                legacySymbols.each { symbol ->
                    if (pool.utf8.any { it != null && it.contains(symbol) }) {
                        throw new GradleException("Compiled class ${classFile} contains removed symbol '${symbol}'")
                    }
                }
            }
        }

        def configClassDir = layout.buildDirectory.file(
            'classes/java/main/team/celeritasctm/config').get().asFile
        def configClasses = fileTree(configClassDir).matching { include 'CeleritasConfigEntryPoint*.class' }.files
        if (configClasses.isEmpty()) {
            throw new GradleException("Config page contract: missing compiled classes under ${configClassDir}")
        }
        def configReferences = configClasses.collectMany { classFile ->
            classPool(classFile.bytes).classes as List
        } as Set
        def expectedConfigClasses = [
            'dhj/embeddedt/embeddium/api/OptionGUIConstructionEvent',
            'dhj/embeddedt/embeddium/api/options/structure/OptionPage',
            'dhj/embeddedt/embeddium/api/options/structure/OptionStorage',
            'dhj/embeddedt/embeddium/api/options/control/TickBoxControl'
        ] as Set
        if (!configReferences.containsAll(expectedConfigClasses)) {
            def missing = expectedConfigClasses - configReferences
            throw new GradleException("Config page contract: compiled classes are missing API references ${missing}")
        }

        // 4. Parse mixin JSON structurally: Actinium owns the BF routing bridge.
        def mixins = new groovy.json.JsonSlurper().parse(mixinConfig.asFile)
        if (!(mixins.client instanceof List)
                || mixins.client.contains('actinium.MixinChunkBuilderMeshingTask')) {
            throw new GradleException('mixins.celeritasctm.json must not register the duplicate BF mixin')
        }

        logger.lifecycle('verifyContracts: OK (Actinium artifact, compiled API, mixin JSON)')
    }
}

def executableTests = [
    'testInternalFaceCulling': 'team.celeritasctm.client.model.InternalFaceCullingTest',
    'testCtmRuleSupport': 'team.celeritasctm.client.resource.CtmRuleSupportTest',
    'testCtmPropertiesParsing': 'team.celeritasctm.client.resource.CtmParsePropertiesTest'
]

tasks.named('compileTestJava', JavaCompile).configure {
    def mainCompileClasspath = tasks.named('compileJava').get().classpath
    doFirst {
        classpath = files(mainCompileClasspath.files.findAll {
            it.exists() && !it.name.equalsIgnoreCase('srg2mcp.jar')
        }) + files(sourceSets.main.output)
    }
}

executableTests.each { taskName, testClass ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = "Runs ${testClass} behavioral tests."
        dependsOn tasks.named('testClasses')
        def testClasspath = tasks.named('compileJava').get().classpath.files.findAll {
            it.exists() && !it.name.equalsIgnoreCase('srg2mcp.jar')
        }
        classpath = sourceSets.test.output + sourceSets.main.output + files(testClasspath)
        mainClass.set(testClass)
    }
}

tasks.named('test', Test).configure {
    enabled = false
}

tasks.named('check').configure {
    dependsOn 'verifyContracts', executableTests.keySet()
}


// ========== Unimined (Minecraft/Cleanroom) ==========

unimined.minecraft {
    version = '1.12.2'

    mappings {
        mcp 'stable', '39-1.12'
    }

    cleanroom {
        loader propertyString('cleanroom_loader_version')

        runs.all {
            args += ['--username', propertyString('minecraft_username')]

            def extraPathArgument = '-Dcrl.dev.extrapath='
            def extraPaths = new LinkedHashSet<String>()
            extraPaths.addAll(project.sourceSets.main.output.files.collect { it.absolutePath })
            jvmArgs.findAll { it.toString().startsWith(extraPathArgument) }.each { argument ->
                extraPaths.addAll(argument.toString().substring(extraPathArgument.length()).tokenize(File.pathSeparator))
            }
            jvmArgs = jvmArgs.findAll { !it.toString().startsWith(extraPathArgument) }
            jvmArgs += "${extraPathArgument}${extraPaths.join(File.pathSeparator)}"
        }
    }

    defaultRemapJar = true

    mods {
        remap(configurations.modCompileOnly)
        remap(configurations.modRuntimeOnly)
    }
}

// ========== Resource Processing ==========

processResources {
    def resourceProperties = [
        'mod_id'         : propertyString('mod_id'),
        'mod_name'       : propertyString('mod_name'),
        'mod_version'    : propertyString('mod_version'),
        'mod_description': propertyString('mod_description'),
        'mod_authors'    : propertyString('mod_authors'),
        'mod_credits'    : propertyString('mod_credits'),
        'mod_url'        : propertyString('mod_url')
    ]

    inputs.properties(resourceProperties)
    filteringCharset = 'UTF-8'

    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        expand(resourceProperties)
        filter { line ->
            resourceProperties.inject(line) { acc, entry ->
                acc.replace("{{ ${entry.key} }}", entry.value).replace("{{${entry.key}}}", entry.value)
            }
        }
    }
}

// ========== JAR Manifest ==========

jar {
    manifest {
        attributes(
            'ModType': 'CRL',
            'MixinConfigs': propertyString('mixin_configs')
        )
    }

    from sourceSets.main.output
    from configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
}

tasks.named('remapJar').configure {
    doFirst {
        logging.captureStandardOutput LogLevel.INFO
    }
    doLast {
        logging.captureStandardOutput LogLevel.QUIET
    }
}

// ========== Compile Options ==========

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Java 8 bytecode is required by the 1.12.2 runtime.
    options.release = 8
}

tasks.named('compileJava', JavaCompile).configure {
    // Fork so the JDK 25 toolchain compiler reads the Java 25 Cleanroom jars.
    options.fork = true
}

// ========== Run Configuration ==========

tasks.named('runClient', JavaExec).configure {
    workingDir = layout.projectDirectory.dir('run/client').asFile
    jvmArgs = jvmArgs.findAll { !it.startsWith('-Xmx') }
    maxHeapSize = '4G'
}

tasks.named('runServer', JavaExec).configure {
    workingDir = layout.projectDirectory.dir('run/server').asFile
}

tasks.named('preRunClient').configure {
    dependsOn tasks.named('classes')
}

tasks.named('preRunServer').configure {
    dependsOn tasks.named('classes')
}
